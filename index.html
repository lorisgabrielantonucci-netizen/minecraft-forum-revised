<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Forum</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Header / Nav Bar Stile Minecraft Forum -->
    <header class="header-main">
        <div class="nav-container">
            <div class="brand-logo" onclick="showTab('forum-tab')">
                <span class="text-green">MINECRAFT</span><span class="text-white">FORUM</span>
            </div>
            <nav class="nav-links">
                <button class="tab-btn active" id="btn-forum" onclick="showTab('forum-tab')">FORUMS</button>
                <button class="tab-btn" id="btn-chat" onclick="showTab('chat-tab')">CHAT GLOBALE</button>
            </nav>
        </div>
    </header>

    <div class="wrapper">
        
        <!-- TAB 1: LISTA FORUM E THREAD -->
        <main id="forum-tab" class="tab-content active">
            <div class="category-header">
                <h2>DISCUSSIONI MINECRAFT</h2>
                <button class="mc-btn" onclick="toggleForm('forum-create-box')">+ CREA THREAD</button>
            </div>

            <!-- Form Creazione Thread -->
            <div id="forum-create-box" class="mc-panel hidden">
                <h3>Crea una Nuova Discussione</h3>
                <input type="text" id="threadTitle" placeholder="Titolo del Thread..." class="mc-input">
                <textarea id="threadContent" placeholder="Scrivi il contenuto..." class="mc-input mc-area"></textarea>
                <div class="upload-box">
                    <label>Carica Immagine (opzionale):</label>
                    <input type="file" id="threadImg" accept="image/*">
                </div>
                <button class="mc-btn" onclick="publishThread()">PUBBLICA THREAD</button>
            </div>

            <!-- Elenco Thread Sfogliabili -->
            <div id="forumList" class="forum-grid"></div>
        </main>

        <!-- TAB 2: VISTA DETTAGLIO THREAD + COMMENTI -->
        <main id="thread-detail-tab" class="tab-content">
            <button class="mc-btn btn-back" onclick="showTab('forum-tab')">← Torna ai Forum</button>
            
            <article class="mc-panel detail-panel">
                <h2 id="detailTitle" class="detail-title"></h2>
                <div id="detailBody" class="detail-body"></div>
                <div id="detailImgBox"></div>
            </article>

            <!-- Sezione Commenti -->
            <section class="mc-panel comments-section">
                <h3>💬 Commenti (<span id="commentCount">0</span>)</h3>
                
                <div id="commentsList" class="comments-list"></div>

                <div class="add-comment-box">
                    <h4>Aggiungi un commento</h4>
                    <input type="text" id="commentUser" placeholder="Il tuo Nickname..." class="mc-input">
                    <textarea id="commentText" placeholder="Scrivi una risposta..." class="mc-input mc-area-sm"></textarea>
                    <div class="upload-box">
                        <label>Allega Foto (opzionale):</label>
                        <input type="file" id="commentImg" accept="image/*">
                    </div>
                    <button class="mc-btn" onclick="addComment()">INVIA COMMENTO</button>
                </div>
            </section>
        </main>

        <!-- TAB 3: CHAT GLOBALE -->
        <main id="chat-tab" class="tab-content">
            <div class="category-header">
                <h2>CHAT GLOBALE</h2>
            </div>

            <div class="mc-panel chat-wrapper">
                <div id="chatMessages" class="chat-display">
                    <div class="system-message">Benvenuto nella Chat Globale di Minecraft Forum!</div>
                </div>

                <div class="chat-controls">
                    <div class="chat-input-row">
                        <input type="text" id="chatUser" placeholder="Nickname..." class="mc-input nick-field">
                        <input type="text" id="chatText" placeholder="Scrivi un messaggio..." class="mc-input text-field">
                    </div>
                    <div class="chat-action-row">
                        <div class="upload-box">
                            <label>Invia Immagine:</label>
                            <input type="file" id="chatImg" accept="image/*">
                        </div>
                        <button class="mc-btn" onclick="sendChatMessage()">INVIA</button>
                    </div>
                </div>
            </div>
        </main>

    </div>
